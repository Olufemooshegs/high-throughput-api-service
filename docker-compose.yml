x-api-environment: &api-environment
  DATABASE_URL: postgresql://app:app@db:5432/high_throughput
  REDIS_URL: redis://redis:6379/0
  BACKPRESSURE_MAX_CONCURRENT_REQUESTS: ${BACKPRESSURE_MAX_CONCURRENT_REQUESTS:-50}
  BACKPRESSURE_RETRY_AFTER_SECONDS: ${BACKPRESSURE_RETRY_AFTER_SECONDS:-1}
  BACKPRESSURE_TEST_DELAY_SECONDS: ${BACKPRESSURE_TEST_DELAY_SECONDS:-0}

x-api-common: &api-common
  build: .
  expose:
    - "8000"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

  api1:
    <<: *api-common
    environment:
      <<: *api-environment
      INSTANCE_ID: api1

  api2:
    <<: *api-common
    environment:
      <<: *api-environment
      INSTANCE_ID: api2

  api3:
    <<: *api-common
    environment:
      <<: *api-environment
      INSTANCE_ID: api3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: high_throughput
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d high_throughput"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
